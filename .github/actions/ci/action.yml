name: CI Workflow
description: "Shared CI workflow."

inputs:
  cargo-flags:
    description: "Flags to pass to cargo commands."
    required: false
    default: ""
  token:
    description: "GitHub token used to download the SSE contract tests; avoids API rate limiting."
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Check formatting
      shell: bash
      run: cargo fmt --check

    - name: Run tests
      shell: bash
      run: cargo test ${{ inputs.cargo-flags }} -p eventsource-client

    - name: Run slower integration tests
      shell: bash
      run: cargo test ${{ inputs.cargo-flags }} -p eventsource-client --lib -- --ignored

    - name: Run clippy checks
      shell: bash
      run: cargo clippy ${{ inputs.cargo-flags }} -p eventsource-client -- -D warnings

    - name: Build contract tests
      shell: bash
      run: CARGO_FLAGS="${{ inputs.cargo-flags }}" make build-contract-tests

    - name: Start contract test service
      shell: bash
      run: CARGO_FLAGS="${{ inputs.cargo-flags }}" make start-contract-test-service-bg

    - name: Run contract tests
      uses: launchdarkly/gh-actions/actions/contract-tests@contract-tests-v1.3.0
      with:
        repo: sse-contract-tests
        branch: main
        version: v2
        token: ${{ inputs.token }}
        test_service_port: '8080'
        debug_logging: 'true'
        enable_persistence_tests: 'false'

name: Run Release Please

on:
  push:
    branches:
      - "main"
      - "feat/**"

jobs:
  release-package:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Needed if using OIDC to get release secrets.
      contents: write # Contents and pull-requests are for release-please to make releases.
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release

      - uses: actions/checkout@v7
        if: ${{ steps.release.outputs['eventsource-client--release_created'] == 'true' }}
        with:
          fetch-depth: 0 # Full history is required for proper changelog generation

      - name: Get Rust version
        if: ${{ steps.release.outputs['eventsource-client--release_created'] == 'true' }}
        id: rust-version
        run: cat ./.github/variables/rust-versions.env >> $GITHUB_OUTPUT

      - name: Setup rust tooling
        if: ${{ steps.release.outputs['eventsource-client--release_created'] == 'true' }}
        env:
          RUST_TARGET: ${{ steps.rust-version.outputs.target }}
        run: |
          rustup override set "$RUST_TARGET"
          rustup component add rustfmt clippy

      - uses: launchdarkly/gh-actions/actions/release-secrets@release-secrets/v1.2.2
        name: "Get crates.io token"
        if: ${{ steps.release.outputs['eventsource-client--release_created'] == 'true' }}
        with:
          aws_assume_role: ${{ vars.AWS_ROLE_ARN }}
          ssm_parameter_pairs: "/production/common/releasing/cratesio/api_token = CARGO_REGISTRY_TOKEN"

      - uses: ./.github/actions/ci
        if: ${{ steps.release.outputs['eventsource-client--release_created'] == 'true' }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/publish
        if: ${{ steps.release.outputs['eventsource-client--release_created'] == 'true' }}
        with:
          dry_run: false
